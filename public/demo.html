<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fútbol Total</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#1a1416;--sf:#241b1e;--sf2:#2e2428;--tx:#f4eeee;--mu:#a99a9e;--rd:#e0314a;--ln:#3a2e32;--ok:#3fbf7f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f2f2;--sf:#fff;--sf2:#efe8e9;--tx:#241b1e;--mu:#6d5f63;--rd:#c4182f;--ln:#e0d6d8;--ok:#1e8f58}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f2f2;--sf:#fff;--sf2:#efe8e9;--tx:#241b1e;--mu:#6d5f63;--rd:#c4182f;--ln:#e0d6d8;--ok:#1e8f58}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 16px/1.45 Barlow,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{margin:0;font:700 28px/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.5px}
h1 b{color:var(--rd)}
.ic{background:var(--sf);border:1px solid var(--ln);border-radius:10px;min-width:44px;height:44px;padding:0 10px}
.demo{background:var(--sf2);border-left:4px solid var(--rd);padding:8px 12px;margin:12px 0;border-radius:6px;font-size:14px;color:var(--mu)}
.demo strong{color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;max-width:140px;background:none;border:0;padding:12px 4px;color:var(--mu);font-weight:600;min-height:48px;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--tx);border-top-color:var(--rd)}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.days button{flex:0 0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:8px 16px;min-height:44px}
.days button[aria-pressed="true"]{background:var(--rd);border-color:var(--rd);color:#fff}
h2{font:700 20px/1.1 "Barlow Condensed",Impact,sans-serif;margin:18px 0 8px}
.card{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.tm.r{justify-content:flex-end;text-align:right}
.tm span:last-child{overflow-wrap:anywhere}
.cr{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px "Barlow Condensed",sans-serif;color:#fff}
.sc{font:700 30px/1 "Barlow Condensed",Impact,sans-serif;text-align:center;min-width:76px}
.st{font-size:13px;color:var(--mu);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.live{color:var(--ok);font-weight:600}
.fav{background:none;border:0;font-size:22px;min-width:44px;min-height:44px;color:var(--mu)}
.fav[aria-pressed="true"]{color:var(--rd)}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}
.tabs button{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;min-height:44px}
.tabs button[aria-selected="true"]{border-color:var(--rd);color:var(--rd)}
.bar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;margin:10px 0;font-size:15px}
.bar .t{height:6px;background:var(--sf2);border-radius:3px;display:flex;overflow:hidden}
.bar i{display:block;background:var(--rd)}
.bar .l{text-align:center;grid-column:1/-1;color:var(--mu);font-size:13px;margin-bottom:-6px}
.nd{color:var(--mu);font-style:italic}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:13px}
td:nth-child(2),th:nth-child(2){text-align:left}
.zone{border-left:4px solid var(--ok)}.zone2{border-left:4px solid #d8a02b}.zone3{border-left:4px solid var(--rd)}
.wrapt{overflow-x:auto}
.ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.ev b{min-width:40px;color:var(--rd);font-family:"Barlow Condensed",sans-serif;font-size:18px}
.pl{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;min-height:44px}
.back{background:none;border:0;color:var(--rd);font-weight:600;padding:12px 0;min-height:44px}
input[type=search]{width:100%;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:12px;font:inherit;margin:12px 0}
.empty{text-align:center;color:var(--mu);padding:36px 12px}
.big{text-align:center;font:700 54px/1 "Barlow Condensed",Impact,sans-serif;margin:8px 0}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .4s}@keyframes pop{from{transform:scale(1.25);color:var(--rd)}}}
:root{--bg:#0d0d0f;--sf:#19191c;--sf2:#242428;--tx:#f5f5f6;--mu:#9d9da6;--rd:#e5243b;--ln:#2f2f35;--ok:#2fcf7f}
:root[data-theme="light"]{--bg:#f1f1f3;--sf:#fff;--sf2:#ececef;--tx:#141416;--mu:#5f5f68;--rd:#c8102e;--ln:#dcdce1;--ok:#168a52}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f1f3;--sf:#fff;--sf2:#ececef;--tx:#141416;--mu:#5f5f68;--rd:#c8102e;--ln:#dcdce1;--ok:#168a52}}
header{background:#0d0d0f;color:#fff;border-bottom:3px solid var(--rd);padding:10px 14px 0}
body::before{background:#0d0d0f}
nav{display:none}.wrap{max-width:900px;padding-bottom:30px}.hd,.chips{max-width:900px}
.hd{flex-wrap:wrap}.lg{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:#fff;min-height:44px}.lg svg{width:30px;height:34px}
#hq{flex:1;min-width:150px;width:auto;margin:0;background:#1d1d21;border:1px solid #34343a;color:#fff;padding:10px 12px}
header .ic{background:#1d1d21;border-color:#34343a;color:#fff}
.chips{margin:6px auto 0;display:flex;overflow-x:auto}.chips button{background:none;border:0;color:#b5b5bd;font-weight:600;padding:10px 12px;min-height:44px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}.chips button[aria-current="page"]{color:#fff;border-bottom-color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.gh{display:flex;align-items:center;gap:8px;margin:22px 0 10px;border-bottom:1px solid var(--ln)}.gh h2{margin:0 0 6px;flex:1}
.cb{width:28px;height:28px;border-radius:6px;background:var(--rd);color:#fff;display:grid;place-items:center;font:700 11px "Barlow Condensed",sans-serif}
.cr{width:40px;height:44px;flex:none;border-radius:0;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);font-size:13px;box-shadow:inset 0 -4px rgba(0,0,0,.25)}.cr.xl{width:68px;height:76px;font-size:19px}
.mc{padding:0;overflow:hidden;margin:0}.mc .top,.top2{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--sf2);font-size:13px;color:var(--mu);gap:8px}
.pill{font-weight:700;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--sf);border:1px solid var(--ln);color:var(--tx);white-space:nowrap}.pill.l{background:var(--rd);border-color:var(--rd);color:#fff}.pill.l::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:6px;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pill.l::before{animation:none}}
.mc .row{padding:14px 10px 8px}.tm,.tm.r{flex-direction:column;justify-content:center;text-align:center;gap:6px;font-size:14px}.tm.lose{opacity:.55}.tm.win>span:last-child{border-bottom:2px solid var(--rd)}
.sc{font-size:42px;letter-spacing:1px}.sc .d{color:var(--mu)}.sc.xl{font-size:60px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 8px;font-size:13px;color:var(--mu)}
.yc,.rcd{display:inline-block;width:9px;height:13px;border-radius:2px;margin:0 4px -2px 0}.yc{background:#f5c518}.rcd{background:var(--rd)}
.mc .st{padding:0 12px 10px}
.hero{background:linear-gradient(160deg,#3a0c14,#0d0d0f 70%);color:#fff;border-radius:14px;margin-bottom:10px;border-bottom:3px solid var(--rd);overflow:hidden;text-align:center}.hero .top2{background:rgba(255,255,255,.08);color:#d4d4da}.hero .row{padding:18px 8px 8px}.hero .gl{color:#d4d4da;padding-top:10px;text-align:left}.hero .pill{margin:6px 0}
.bar .t{background:#6b6b75}
.pitch{background:repeating-linear-gradient(#237a45 0 36px,#2b8a50 36px 72px);border:2px solid #e9f2ec;border-radius:10px;max-width:420px;margin:0 auto;height:min(520px,125vw);display:flex;flex-direction:column-reverse;justify-content:space-around;padding:8px 2px;position:relative}.pitch::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.5)}
.pr{display:flex;justify-content:space-around;z-index:1}.pp{background:none;border:0;color:#fff;font-size:11px;font-weight:600;text-align:center;width:76px;min-height:44px;padding:0}.pp i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#111;font-style:normal;font-weight:700;margin:0 auto 2px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pg div{background:var(--sf2);border-radius:8px;padding:8px}.pg b{display:block;font-size:20px;font-family:"Barlow Condensed",sans-serif}.pg span{font-size:13px;color:var(--mu)}
.gi{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--rd);color:#fff;font-size:11px;font-weight:700}
.lt{display:flex;align-items:center;gap:8px}.lt .cr{width:20px;height:22px;font-size:8px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-top:8px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
@media (max-width:560px){.x{display:none}.sc{font-size:36px}}
</style>
</head>
<body>
<header><div class="hd"><button class="lg" data-v="home" aria-label="Ir a Partidos"><svg viewBox="0 0 30 34" aria-hidden="true"><path d="M1 1h28v19L15 33 1 20z" fill="#e5243b"/><path d="M15 6l7 5-3 8h-8l-3-8z" fill="#fff"/></svg><h1>FÚTBOL <b>TOTAL</b></h1></button><input type="search" id="hq" placeholder="Buscar equipos, jugadores, ligas" aria-label="Buscar equipos, jugadores y competiciones"><button class="ic" data-v="fav" aria-label="Favoritos">★</button><button class="ic" id="th" aria-label="Cambiar tema claro u oscuro">Tema</button></div><div class="chips" role="navigation" aria-label="Secciones"><button data-v="home">Partidos</button><button data-v="live">En vivo</button><button data-v="comp">Ligas</button><button data-v="cup">Copas</button><button data-v="tab">Tablas</button><button data-v="teams">Equipos</button><button data-v="players">Jugadores</button></div></header>
<main class="wrap" id="app"></main>
<nav aria-label="Navegación principal">
<button data-v="home">Partidos</button><button data-v="comp">Ligas</button><button data-v="fav">Favoritos</button><button data-v="search">Buscar</button>
</nav>
<script>
(function(){
var COLORS=["#b3202f","#1f5fa8","#2b8a5a","#c08a14","#6b3fa0","#0f8b94","#a8501f","#47525e"];
var T={1:["Ribera Atlético","RIB"],2:["Deportivo Pampa","PAM"],3:["Unión del Sur","UDS"],4:["Club Sierra","SIE"],5:["Estudiantes del Plata","EDP"],6:["Real Norte","RNO"],7:["Sporting Valle","SPV"],8:["Atlético Costa","ATC"]};
var COMPS=[{id:"a",n:"Liga Demo Argentina",ids:[1,2,3,4]},{id:"b",n:"Copa Demo Sudamericana",ids:[5,6,7,8]}];
var NOW=new Date();
function at(off,h,m){var d=new Date(NOW);d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d}
var M=[
{id:1,c:"a",h:1,a:2,s:"FT",hs:2,as:1,t:at(-1,18,0),ev:[[12,"Gol","Ribera Atlético: M. Benítez"],[34,"Amarilla","Deportivo Pampa: L. Ocampo"],[58,"Gol","Deportivo Pampa: J. Ruiz"],[81,"Gol","Ribera Atlético: T. Aguirre"]],st:{pos:[54,46],sh:[14,9],on:[6,3],co:[7,4],fl:[11,15],yc:[1,2],rc:[0,0],ps:[498,421],pa:[86,81],xg:null}},
{id:2,c:"b",h:5,a:6,s:"FT",hs:0,as:0,t:at(-1,20,30),ev:[[44,"Amarilla","Real Norte: P. Vega"]],st:{pos:[49,51],sh:[8,10],on:[2,3],co:[5,6],fl:[13,12],yc:[0,1],rc:[0,0],ps:null,pa:null,xg:null}},
{id:3,c:"a",h:3,a:4,s:"LIVE",min:67,hs:1,as:1,t:at(0,16,0),ev:[[23,"Gol","Unión del Sur: F. Luna"],[49,"Gol","Club Sierra: D. Paz"],[60,"Amarilla","Unión del Sur: C. Soto"]],st:{pos:[58,42],sh:[9,7],on:[4,3],co:[5,2],fl:[8,9],yc:[1,0],rc:[0,0],ps:[301,227],pa:[88,79],xg:null}},
{id:4,c:"b",h:7,a:8,s:"NS",t:at(0,21,0),ev:[],st:null},
{id:5,c:"a",h:2,a:1,s:"NS",t:at(1,17,0),ev:[],st:null},
{id:6,c:"b",h:6,a:7,s:"PST",t:at(1,19,15),ev:[],st:null}
];
var LU=function(n){return {f:[[1,"Arquero A","POR"],[2,"Defensor B","DEF"],[3,"Defensor C","DEF"],[4,"Mediocampista D","MED"],[5,"Delantero E","DEL"]],b:[[12,"Suplente F","MED"],[13,"Suplente G","DEL"]]}};
var PD={"Delantero E":{sh:3,on:2,tk:"—",fw:2,fc:1,gl:1},"Mediocampista D":{sh:1,on:0,tk:4,fw:3,fc:2,gl:0}};
var ST={NS:"Próximo",FT:"Finalizado",PST:"Aplazado",LIVE:"En vivo"};
var S={v:"home",day:0,m:null,mt:"ev",q:"",fav:{},th:null};
try{S.fav=JSON.parse(localStorage.getItem("ft-fav")||"{}");S.th=localStorage.getItem("ft-th")}catch(e){}
function sv(){try{localStorage.setItem("ft-fav",JSON.stringify(S.fav))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cr(id){return '<span class="cr" style="background:'+COLORS[(id-1)%8]+'" aria-hidden="true">'+T[id][1]+'</span>'}
function tm(id,r){return '<span class="tm'+(r?" r":"")+'">'+(r?"":cr(id))+'<span>'+esc(T[id][0])+'</span>'+(r?cr(id):"")+'</span>'}
function hm(d){return d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})}
function dl(d){return d.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})}
function stat(m){return m.s==="LIVE"?'<span class="live">En vivo · '+m.min+'\u2019</span>':ST[m.s]}
function card(m){
var sc=(m.s==="NS"||m.s==="PST")?hm(m.t):m.hs+" - "+m.as;
return '<button class="card" data-m="'+m.id+'" aria-label="'+esc(T[m.h][0]+" contra "+T[m.a][0])+'"><div class="row">'+tm(m.h)+'<span class="sc">'+sc+'</span>'+tm(m.a,1)+'</div><div class="st"><span>'+stat(m)+'</span><span>'+dl(m.t)+' · hora local</span></div></button>'}
function demo(){return '<div class="demo" role="note"><strong>Modo demostración.</strong> Equipos, marcadores y estadísticas son ficticios y no se actualizan. Al conectar un proveedor real, este aviso desaparece.</div>'}
function home(){
var h=demo()+'<div class="days" role="group" aria-label="Elegir día">';
[-1,0,1].forEach(function(o){var l=o===0?"Hoy":o<0?"Ayer":"Mañana";h+='<button data-d="'+o+'" aria-pressed="'+(S.day===o)+'">'+l+'</button>'});
h+='</div>';
var any=false;
COMPS.forEach(function(c){
var ms=M.filter(function(m){var d=new Date(NOW);d.setDate(d.getDate()+S.day);return m.c===c.id&&m.t.toDateString()===d.toDateString()});
if(!ms.length)return;any=true;
h+='<h2>'+esc(c.n)+'</h2>'+ms.map(card).join("")});
if(!any)h+='<div class="empty">No hay partidos cargados para este día.</div>';
return h}
function bar(l,v,pct){
var a=v[0],b=v[1],t=(a+b)||1;
return '<div class="bar"><div class="l">'+l+'</div><span>'+a+(pct?"%":"")+'</span><div class="t"><i style="width:'+(a/t*100)+'%"></i></div><span>'+b+(pct?"%":"")+'</span></div>'}
function nd(l){return '<div class="bar"><div class="l">'+l+'</div><span class="nd" style="grid-column:1/-1;text-align:center">No disponible en esta fuente</span></div>'}
function detail(){
var m=M.filter(function(x){return x.id===S.m})[0];
var h='<button class="back" data-back="1">‹ Volver a partidos</button><div class="card"><div class="row">'+tm(m.h)+'<span class="sc pop">'+((m.s==="NS"||m.s==="PST")?hm(m.t):m.hs+" - "+m.as)+'</span>'+tm(m.a,1)+'</div><div class="st"><span>'+stat(m)+'</span><span>'+esc(COMPS.filter(function(c){return c.id===m.c})[0].n)+'</span></div></div>';
h+='<div class="tabs" role="tablist">';
[["ev","Cronología"],["st","Estadísticas"],["lu","Alineaciones"]].forEach(function(t){h+='<button role="tab" data-t="'+t[0]+'" aria-selected="'+(S.mt===t[0])+'">'+t[1]+'</button>'});
h+='</div>';
if(S.mt==="ev"){
h+=m.ev.length?m.ev.map(function(e){return '<div class="ev"><b>'+e[0]+'\u2019</b><span><strong>'+e[1]+'</strong> · '+esc(e[2])+'</span></div>'}).join(""):'<div class="empty">Todavía no hay acontecimientos.</div>'}
if(S.mt==="st"){
var s=m.st;
if(!s)h+='<div class="empty">Las estadísticas aparecen cuando empieza el partido.</div>';
else{h+=bar("Posesión",s.pos,1)+bar("Remates totales",s.sh)+bar("Remates al arco",s.on)+bar("Córneres",s.co)+bar("Faltas cometidas",s.fl)+bar("Tarjetas amarillas",s.yc)+bar("Tarjetas rojas",s.rc)+(s.ps?bar("Pases totales",s.ps):nd("Pases totales"))+(s.pa?bar("Precisión de pases",s.pa,1):nd("Precisión de pases"))+nd("Goles esperados (xG)")}}
if(S.mt==="lu"){
if(m.s==="NS"||m.s==="PST")h+='<div class="empty">La formación se publica cuando es anunciada oficialmente.</div>';
else{var l=LU();h+='<h2>Titulares · 4-3-3 (demo)</h2>'+l.f.map(pl).join("")+'<h2>Suplentes</h2>'+l.b.map(pl).join("");
if(S.p){var p=PD[S.p];h+='<h2>'+esc(S.p)+'</h2>';
if(!p)h+='<div class="nd">Sin estadísticas individuales para este jugador.</div>';
else h+='<div class="card">Al arco: '+p.on+' · Remates: '+p.sh+' · Barridas: '+p.tk+' · Faltas ganadas: '+p.fw+' · Faltas cometidas: '+p.fc+' · Goles: '+p.gl+'</div>'}}}
return h}
function pl(p){return '<button class="pl" data-p="'+esc(p[1])+'">'+p[0]+'. '+esc(p[1])+' <span class="nd">'+p[2]+'</span></button>'}
